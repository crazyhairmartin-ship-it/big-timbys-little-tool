name: Record GE prices

# Hourly snapshot of the OSRS Wiki /1h prices, appended to per-day JSON files
# on the `price-history` branch. Accumulates hourly history beyond the wiki's
# own ~15-day window. Runs from the default branch; writes only to
# `price-history`, so it never triggers a Vercel deploy.
#
# Security note: no untrusted event input (issue/PR/commit text) is used in
# any run: step — only `date`, git, and the committed recorder script.

on:
  schedule:
    - cron: "7 * * * *"   # hourly, at :07 UTC (cron is best-effort)
  workflow_dispatch:        # allow manual runs

permissions:
  contents: write

concurrency: record-prices  # never let two runs overlap

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (default branch — for the recorder script)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stash the recorder script
        run: cp scripts/record-prices.mjs "$RUNNER_TEMP/record-prices.mjs"

      - name: Switch to the price-history data branch
        run: |
          git config user.name "price-recorder"
          git config user.email "noreply@github.com"
          if git show-ref --verify --quiet refs/remotes/origin/price-history; then
            git checkout price-history
          else
            git checkout --orphan price-history
            git rm -rf --quiet . 2>/dev/null || true
          fi

      - name: Record hourly snapshot
        run: node "$RUNNER_TEMP/record-prices.mjs"

      - name: Commit & push
        run: |
          git add prices
          if git commit -m "Record prices $(date -u +'%Y-%m-%d %H:00 UTC')"; then
            git push origin price-history
          else
            echo "nothing to commit"
          fi
